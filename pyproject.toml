[project]
name = "panopticon"
version = "1.0.0"
description = "Read-only unified index of repositories, Git history, releases, packages and CI metadata, exposed as a REST API, MCP server and dashboard."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["github", "git", "index", "mcp", "sqlite", "self-hosted", "dashboard"]
classifiers = [
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "dbwarden>=0.20",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "packaging>=24",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/emiliano-go/panopticon"
Repository = "https://github.com/emiliano-go/panopticon"
Issues = "https://github.com/emiliano-go/panopticon/issues"

[project.scripts]
panopticon = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
